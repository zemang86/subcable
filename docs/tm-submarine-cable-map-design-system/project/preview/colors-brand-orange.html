<!doctype html>
<html><head><meta charset="utf-8"><title>Brand orange</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:18px; align-items:flex-start;">
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#F05A22; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Primary</div>
    <div class="meta">#F05A22<br/>--tm-orange</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#FF4D00; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Hot</div>
    <div class="meta">#FF4D00<br/>--tm-orange-hot · stats</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#BC3514; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Deep</div>
    <div class="meta">#BC3514<br/>--tm-orange-deep</div>
  </div>
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:rgba(240,90,34,0.60); border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase;">60% TINT</div>
    <div class="meta">card gradients</div>
  </div>
</div></body></html>
