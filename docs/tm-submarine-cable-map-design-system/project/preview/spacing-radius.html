<!doctype html>
<html><head><meta charset="utf-8"><title>Radius</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:22px;">
  
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--tm-blue); border:1px solid rgba(255,255,255,0.4); border-radius:0px;"></div>
      <div class="meta">0px</div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--tm-fg);">TACTICAL</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--tm-blue); border:1px solid rgba(255,255,255,0.4); border-radius:2px;"></div>
      <div class="meta">2px</div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--tm-fg);">XS</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--tm-blue); border:1px solid rgba(255,255,255,0.4); border-radius:4px;"></div>
      <div class="meta">4px</div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--tm-fg);">SM · cable card</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--tm-blue); border:1px solid rgba(255,255,255,0.4); border-radius:8px;"></div>
      <div class="meta">8px</div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--tm-fg);">MD</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:64px; height:64px; background:var(--tm-blue); border:1px solid rgba(255,255,255,0.4); border-radius:9999px;"></div>
      <div class="meta">9999px</div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--tm-fg);">PILL · toggle only</div>
    </div>
</div></body></html>
