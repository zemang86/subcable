<!doctype html>
<html><head><meta charset="utf-8"><title>Input</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card col" style="gap:10px;">
  <label class="col" style="gap:4px; width:340px;">
    <span class="tm-h-eye" style="font-size:9px;">FROM</span>
    <div class="tm-input">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--tm-fg)" stroke-width="1.6" stroke-linecap="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      <span style="margin-left:10px; font-family:var(--tm-mono); font-size:12px; color:var(--tm-fg);">Cherating, Malaysia</span>
      <span style="margin-left:auto; color:var(--tm-fg);">▾</span>
    </div>
  </label>
  <div class="meta">Power-icon prefix · blue fill · white firm border · 48px min</div>
</div></body></html>
