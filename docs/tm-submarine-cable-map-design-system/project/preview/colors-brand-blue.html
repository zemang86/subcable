<!doctype html>
<html><head><meta charset="utf-8"><title>Brand blue</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:18px; align-items:flex-start;">
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#034DA1; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Primary</div>
    <div class="meta">#034DA1<br/>--tm-blue</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#0362A1; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Alt</div>
    <div class="meta">#0362A1<br/>--tm-blue-2</div>
  </div>
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:rgba(3,77,161,0.44); border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase;">FILL 44%</div>
    <div class="meta">--tm-blue-fill</div>
  </div>
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:rgba(3,77,161,0.30); border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase;">SOFT 30%</div>
    <div class="meta">--tm-blue-soft</div>
  </div>
</div></body></html>
