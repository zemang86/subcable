<!doctype html>
<html><head><meta charset="utf-8"><title>Morse keys</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card col" style="gap:8px; padding:14px 22px;">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; width:520px;">
    <button class="tm-btn-primary" style="min-height:56px; flex-direction:column; padding:6px 0; display:flex; align-items:center; justify-content:center;">
      <span style="font-family:var(--tm-display); font-size:28px; font-weight:700; line-height:1;">·</span>
      <span style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.18em;">DOT</span>
    </button>
    <button class="tm-btn-primary" style="min-height:56px; flex-direction:column; padding:6px 0; display:flex; align-items:center; justify-content:center;">
      <span style="font-family:var(--tm-display); font-size:28px; font-weight:700; line-height:1;">—</span>
      <span style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.18em;">DASH</span>
    </button>
  </div>
  <div class="meta">56px primary keys · DOT / DASH</div>
</div></body></html>
