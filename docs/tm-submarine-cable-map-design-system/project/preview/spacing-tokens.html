<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card col" style="gap:8px;">
  
    <div class="row" style="gap:14px;">
      <div style="width:4px; height:14px; background:var(--tm-orange);"></div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:11px; letter-spacing:0.12em; color:var(--tm-fg); min-width:90px;">SPACE&nbsp;1</div>
      <div class="meta">4px · --tm-space-1</div>
    </div>
    <div class="row" style="gap:14px;">
      <div style="width:8px; height:14px; background:var(--tm-orange);"></div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:11px; letter-spacing:0.12em; color:var(--tm-fg); min-width:90px;">SPACE&nbsp;2</div>
      <div class="meta">8px · --tm-space-2</div>
    </div>
    <div class="row" style="gap:14px;">
      <div style="width:12px; height:14px; background:var(--tm-orange);"></div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:11px; letter-spacing:0.12em; color:var(--tm-fg); min-width:90px;">SPACE&nbsp;3</div>
      <div class="meta">12px · --tm-space-3</div>
    </div>
    <div class="row" style="gap:14px;">
      <div style="width:16px; height:14px; background:var(--tm-orange);"></div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:11px; letter-spacing:0.12em; color:var(--tm-fg); min-width:90px;">SPACE&nbsp;4</div>
      <div class="meta">16px · --tm-space-4</div>
    </div>
    <div class="row" style="gap:14px;">
      <div style="width:20px; height:14px; background:var(--tm-orange);"></div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:11px; letter-spacing:0.12em; color:var(--tm-fg); min-width:90px;">SPACE&nbsp;5</div>
      <div class="meta">20px · --tm-space-5</div>
    </div>
    <div class="row" style="gap:14px;">
      <div style="width:24px; height:14px; background:var(--tm-orange);"></div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:11px; letter-spacing:0.12em; color:var(--tm-fg); min-width:90px;">SPACE&nbsp;6</div>
      <div class="meta">24px · --tm-space-6</div>
    </div>
    <div class="row" style="gap:14px;">
      <div style="width:32px; height:14px; background:var(--tm-orange);"></div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:11px; letter-spacing:0.12em; color:var(--tm-fg); min-width:90px;">SPACE&nbsp;8</div>
      <div class="meta">32px · --tm-space-8</div>
    </div>
    <div class="row" style="gap:14px;">
      <div style="width:48px; height:14px; background:var(--tm-orange);"></div>
      <div style="font-family:var(--tm-heading); font-weight:600; font-size:11px; letter-spacing:0.12em; color:var(--tm-fg); min-width:90px;">SPACE&nbsp;12</div>
      <div class="meta">48px · --tm-space-12</div>
    </div>
</div></body></html>
