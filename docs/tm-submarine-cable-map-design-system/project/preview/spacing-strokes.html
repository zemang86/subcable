<!doctype html>
<html><head><meta charset="utf-8"><title>Strokes & Bevel</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:22px;">
  <div class="col" style="gap:6px; align-items:center;">
    <div style="width:84px; height:64px; background:transparent; border:0.5px solid rgba(255,255,255,0.5);"></div>
    <div class="meta">HAIR · 0.5px</div>
  </div>
  <div class="col" style="gap:6px; align-items:center;">
    <div style="width:84px; height:64px; background:transparent; border:1px solid rgba(255,255,255,0.5);"></div>
    <div class="meta">FIRM · 1px</div>
  </div>
  <div class="col" style="gap:6px; align-items:center;">
    <div style="width:84px; height:64px; background:transparent; border:2px solid rgba(255,255,255,0.7);"></div>
    <div class="meta">BOLD · 2px</div>
  </div>
  <div class="col" style="gap:6px; align-items:center;">
    <div class="tm-card-bevel" style="width:120px; height:64px;"></div>
    <div class="meta">BEVEL · 16px cut TR</div>
  </div>
  <div class="col" style="gap:6px; align-items:center;">
    <div class="tm-bracket" style="width:84px; height:64px;"><span class="bracket-tl"></span><span class="bracket-br"></span></div>
    <div class="meta">BRACKET · 12px L-tick</div>
  </div>
</div></body></html>
