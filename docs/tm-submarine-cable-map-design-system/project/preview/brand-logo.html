<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:24px; align-items:center;">
  <img src="../assets/logo-tm-global.png" alt="TM Global" style="height:80px; width:auto;" />
  <div class="col" style="gap:6px;">
    <div style="font-family:var(--tm-display); font-weight:700; font-size:18px; letter-spacing:0.04em;">TM Global</div>
    <div class="meta">Wordmark used on splash + bottom-left chrome</div>
    <div class="meta">"Brought to you by" prefix · IBM Plex Mono 30px</div>
  </div>
</div></body></html>
