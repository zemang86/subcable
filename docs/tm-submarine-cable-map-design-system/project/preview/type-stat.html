<!doctype html>
<html><head><meta charset="utf-8"><title>Stat</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:30px;">
  <div class="col">
    <div class="tm-h-eye" style="margin-bottom:4px;">KM OF CABLE ON SEAFLOOR</div>
    <div style="font-family:var(--tm-stat); font-size:44px; color: var(--tm-orange-hot); line-height:1; font-variant-numeric:tabular-nums;">1.3M</div>
  </div>
  <div class="col">
    <div class="tm-h-eye" style="margin-bottom:4px;">CABLES WORLDWIDE</div>
    <div style="font-family:var(--tm-stat); font-size:44px; color: var(--tm-orange-hot); line-height:1; font-variant-numeric:tabular-nums;">600+</div>
  </div>
  <div class="meta" style="margin-left:auto; align-self:flex-end;">B612 Mono · 28–32px · orange-hot · tabular nums</div>
</div></body></html>
