<!doctype html>
<html><head><meta charset="utf-8"><title>Display</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card" style="padding:14px 22px;">
  <div style="font-family:var(--tm-display); font-weight:700; font-size:52px; line-height:1; letter-spacing:0.02em; color: var(--tm-fg);">Submarine Cable Map</div>
  <div style="display:flex; gap:24px; margin-top:10px; align-items:baseline;">
    <span class="meta">Chakra Petch / Bold 700</span>
    <span class="meta">88px → 56px on kiosk</span>
    <span class="meta">Page banners only</span>
  </div>
</div></body></html>
