<!doctype html>
<html><head><meta charset="utf-8"><title>Status</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:18px; align-items:flex-start;">
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#8FFF3F; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Active</div>
    <div class="meta">#8FFF3F<br/>--tm-active</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#3F642E; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Active bg</div>
    <div class="meta">#3F642E<br/>middle ring</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#FF3F3F; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Inactive</div>
    <div class="meta">#FF3F3F<br/>--tm-inactive</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#ED1B2E; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Hot red</div>
    <div class="meta">#ED1B2E<br/>--tm-inactive-2 · selected line</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#642E2E; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Inactive bg</div>
    <div class="meta">#642E2E<br/>middle ring</div>
  </div>
</div></body></html>
