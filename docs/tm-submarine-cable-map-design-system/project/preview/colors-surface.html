<!doctype html>
<html><head><meta charset="utf-8"><title>Surface</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:18px; align-items:flex-start;">
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#040E1F; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Page bg</div>
    <div class="meta">#040E1F<br/>--tm-bg</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#061630; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Deep panel</div>
    <div class="meta">#061630<br/>--tm-bg-deep</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#0A0449; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Cobalt</div>
    <div class="meta">#0A0449<br/>--tm-bg-cobalt</div>
  </div>
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:var(--tm-bg);" class="tm-tv-grid"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase;">TV GRID</div>
    <div class="meta">3×3 wall overlay</div>
  </div>
</div></body></html>
