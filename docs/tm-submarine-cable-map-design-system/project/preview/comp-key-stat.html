<!doctype html>
<html><head><meta charset="utf-8"><title>Key Statistic</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:14px;">
  <div class="tm-card-bevel" style="width:194px; height:66px; padding:10px 14px; display:flex; flex-direction:column; justify-content:space-between;">
    <span class="tm-h-eye" style="font-size:9px;">km of cable on seafloor</span>
    <span class="tm-h-stat" style="font-size:32px; text-align:right;">1.3M</span>
  </div>
  <div class="tm-card-bevel" style="width:194px; height:66px; padding:10px 14px; display:flex; flex-direction:column; justify-content:space-between;">
    <span class="tm-h-eye" style="font-size:9px;">first trans-Atlantic cable</span>
    <span class="tm-h-stat" style="font-size:32px; text-align:right;">1866</span>
  </div>
  <div class="tm-card-bevel" style="width:194px; height:66px; padding:10px 14px; display:flex; flex-direction:column; justify-content:space-between;">
    <span class="tm-h-eye" style="font-size:9px;">of global internet traffic</span>
    <span class="tm-h-stat" style="font-size:32px; text-align:right;">95%+</span>
  </div>
</div></body></html>
