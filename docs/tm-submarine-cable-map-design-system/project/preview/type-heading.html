<!doctype html>
<html><head><meta charset="utf-8"><title>Heading</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card">
  <div style="font-family:var(--tm-heading); font-weight:600; font-size:22px; letter-spacing:0.04em; color: var(--tm-fg); margin-bottom:6px;">Cable System</div>
  <div style="font-family:var(--tm-heading); font-weight:500; font-size:18px; letter-spacing:0.06em; color: var(--tm-fg); margin-bottom:6px;">CABLE INFORMATION</div>
  <div class="tm-h-label" style="margin-bottom:4px;">FIELD LABEL · 11px</div>
  <div class="tm-h-eye">EYEBROW · 10PX · WIDE</div>
  <div class="meta" style="margin-top:10px;">Rajdhani / 400 · 500 · 600 — headings, labels, buttons</div>
</div></body></html>
