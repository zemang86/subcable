<!doctype html>
<html><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card col" style="gap:6px;">
  <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-family:var(--tm-display); font-weight:700; font-size:52px; line-height:1;">Aa</span><span class="meta">DISPLAY · Chakra Petch 56–88 / 700</span></div>
  <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-family:var(--tm-heading); font-weight:600; font-size:22px;">Aa</span><span class="meta">HEADING · Rajdhani 16–24 / 600</span></div>
  <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-family:var(--tm-heading); font-weight:500; font-size:11px; letter-spacing:0.15em; text-transform:uppercase;">Aa</span><span class="meta">LABEL · Rajdhani 11 / 500 · uppercase · 0.15em</span></div>
  <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-family:var(--tm-mono); font-size:13px;">Aa</span><span class="meta">BODY · IBM Plex Mono 11–13 / 400</span></div>
  <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-family:var(--tm-stat); font-size:28px; color:var(--tm-orange-hot);">17</span><span class="meta">STAT · B612 Mono 28–32 / 400 · tabular</span></div>
  <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-family:var(--tm-pixel); font-size:10px;">Aa</span><span class="meta">COORDS · Space Mono 8–10 / 400</span></div>
</div></body></html>
