<!doctype html>
<html><head><meta charset="utf-8"><title>Text</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body { margin:0; padding:0; background: var(--tm-bg); color: var(--tm-fg);
              font-family: var(--tm-mono); overflow:hidden; }
  .card { padding: 18px 22px; box-sizing: border-box; }
  .meta { font-family: var(--tm-mono); font-size: 9px; color: var(--tm-mute);
          letter-spacing: 0.04em; }
  .row { display:flex; align-items:center; gap: 12px; }
  .col { display:flex; flex-direction:column; }
  .grid { display:grid; }
</style>
</head><body>
<div class="card row" style="gap:18px; align-items:flex-start;">
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#FFFFFF; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Primary</div>
    <div class="meta">#FFFFFF<br/>--tm-fg</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#F1F7FF; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Iceblue</div>
    <div class="meta">#F1F7FF<br/>--tm-fg-iceblue</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#C4C4C4; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Mute</div>
    <div class="meta">#C4C4C4<br/>--tm-mute · 70% emphasis</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#D9D9D9; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Mute 2</div>
    <div class="meta">#D9D9D9<br/>--tm-mute-2 · light fills</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#4E4F4E; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Dark</div>
    <div class="meta">#4E4F4E<br/>--tm-mute-dark · placeholder</div>
  </div>
  
  <div class="col" style="gap:6px;">
    <div style="width:78px; height:78px; background:#78625A; border:1px solid rgba(255,255,255,0.18);"></div>
    <div style="font-family:var(--tm-heading); font-weight:600; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--tm-fg);">Brown</div>
    <div class="meta">#78625A<br/>--tm-brown · backspace</div>
  </div>
</div></body></html>
